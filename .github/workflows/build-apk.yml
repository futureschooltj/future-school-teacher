name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: |
          mkdir -p www
          cp "$(ls index*.html | head -n 1)" www/index.html
          npx esbuild main.js --bundle --minify --format=iife --platform=browser --external:fs --outfile=www/bundle.js

      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow
          python3 "$(ls make_icons*.py | head -n 1)" android/app/src/main/res
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FutureSchoolTeacher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FutureSchoolTeacher-apk
          path: FutureSchoolTeacher.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" FutureSchoolTeacher.apk \
            --title "Future School Teacher v${{ github.run_number }}" \
            --notes "APK for Android"
