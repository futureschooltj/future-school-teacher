<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B44D6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Future School Teacher</title>
<script src="bundle.js"></script>
<style>
:root{
  --bg:#F3F4FA;--card:#FFFFFF;--ink:#13152E;--mut:#5C6283;--line:#E2E4F0;
  --pri:#2B44D6;--pri-ink:#FFFFFF;--pri-soft:#E7EBFF;--acc:#FFB703;--acc-ink:#3A2A00;
  --ok:#0F8A4B;--ok-soft:#DDF5E7;--warn:#9A5B00;--warn-soft:#FFF0D2;--bad:#C62F2F;--bad-soft:#FDE3E3;
  --shadow:0 1px 2px rgba(19,21,46,.06),0 4px 14px rgba(19,21,46,.05);
  --r:16px;--r-s:11px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F1E;--card:#171A30;--ink:#ECEEFB;--mut:#9AA1C7;--line:#272B49;
    --pri:#8197FF;--pri-ink:#0D0F1E;--pri-soft:#222852;--acc:#FFC933;--acc-ink:#2B1F00;
    --ok:#4ADE97;--ok-soft:#14352A;--warn:#FFC25A;--warn-soft:#3B2D10;--bad:#FF8585;--bad-soft:#41191B;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F1E;--card:#171A30;--ink:#ECEEFB;--mut:#9AA1C7;--line:#272B49;
  --pri:#8197FF;--pri-ink:#0D0F1E;--pri-soft:#222852;--acc:#FFC933;--acc-ink:#2B1F00;
  --ok:#4ADE97;--ok-soft:#14352A;--warn:#FFC25A;--warn-soft:#3B2D10;--bad:#FF8585;--bad-soft:#41191B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:58px}
:root[data-theme="dark"] .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}}
.top .logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.top .logo img{width:100%;height:100%;object-fit:contain}
.top h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;font-weight:500;opacity:.8}
.ib{width:44px;height:44px;border:0;background:transparent;color:inherit;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib:active{background:rgba(127,127,127,.2)}
.ib svg{width:24px;height:24px}
.dot{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

main{padding:14px 14px 96px;max-width:760px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mut);cursor:pointer;border-radius:12px;position:relative;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pri);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:2px;background:var(--pri)}
.nav .dot{top:2px;right:calc(50% - 20px)}

/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--pri-soft)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.sm{font-size:13.5px}
.xs{font-size:12px}
.b{font-weight:700}
.h2{font-size:20px;font-weight:700;margin:4px 0 10px}
.h3{font-size:16px;font-weight:700;margin:14px 0 8px}
.gap{height:10px}
.tc{text-align:center}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.wht{background:var(--card);color:var(--ink);border:1.5px solid var(--mut)}
.chip.gray{background:var(--line);color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:13px;border:0;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;font-size:16px}
.btn:active{filter:brightness(.9)}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.sm2{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:20px;height:20px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}

/* form */
label.f{display:block;margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--mut)}
label.f>span{display:block;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=time],input[type=number],input[type=tel],input[type=url],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:12px;width:24px;height:24px;color:var(--mut)}
.search input{padding-left:44px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;min-height:96px;box-shadow:var(--shadow);position:relative}
.tile:active{background:var(--pri-soft)}
.tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.tile .ti svg{width:24px;height:24px}
.tile b{font-size:15.5px}
.tile .dot{top:10px;right:10px}
.hero{background:var(--pri);color:var(--pri-ink);border-radius:20px;padding:18px;margin-bottom:12px}
:root[data-theme="dark"] .hero{background:var(--pri-soft);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:var(--pri-soft);color:var(--ink)}}
.hero .big{font-size:22px;font-weight:800;margin:2px 0 4px}
.hero .btn{margin-top:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--acc)}.bar.bad>i{background:var(--bad)}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.time{min-width:62px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.lesson{border-left:5px solid var(--pri)}
.lesson.conf{border-left-color:var(--bad)}
.lesson.done{border-left-color:var(--ok)}
.unread{border-left:5px solid var(--acc)}
.high{border-left:5px solid var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -14px 12px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:12px 12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;font-size:15px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.att3{display:flex;gap:6px}
.att3 button{flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:14px}
.att3 button.p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.att3 button.a.on{background:var(--bad);border-color:var(--bad);color:#fff}
.att3 button.l.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.opt input{width:20px;height:20px;flex:none}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.tblw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--pri-soft);color:var(--pri);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,12,30,.55);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:18px}
.sheet .sb{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:70;font-weight:600;font-size:14.5px;max-width:90%;display:none;text-align:center}
#toast.on{display:block}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px 20px}
.login .lg{width:84px;height:84px;border-radius:24px;background:#fff;margin:0 auto 14px;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}
.login .lg img{width:100%;height:100%;object-fit:contain}
.login h1{text-align:center;font-size:26px;margin-bottom:4px}
.login p{text-align:center;margin:0 0 22px;color:var(--mut)}

@media print{
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{position:absolute;left:0;top:0;width:100%}
  .top,.nav,.fab,#toast{display:none!important}
  th{background:#eee!important;color:#000!important}
  td,th{white-space:normal}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>

const SUBS=[];let nT=null;
function resetData(){COLS.forEach(c=>{S[c]={};loaded[c]=false})}
function unsubAll(){while(SUBS.length){try{SUBS.pop()()}catch(e){}}}
function subscribe(){
  unsubAll();resetData();
  const wide=ROLE==='admin'||ROLE==='head';
  const filt={};
  if(!wide){filt.tattend=['teacherId','==',meId];filt.reports=['teacherId','==',meId];filt.tasks=['assignee','==',meId];filt.messages=['from','==',meId];filt.notices=['to','in',['all',meId]]}
  COLS.forEach(c=>{
    if(c==='resets'&&ROLE!=='admin')return;
    SUBS.push(DB.collection(c,filt[c]).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      S[c]=o;loaded[c]=true;render();
      if(c==='lessons'||c==='groups'){clearTimeout(nT);nT=setTimeout(planNotifs,2500)}
    },err=>{console.warn('sub',c,err&&err.code)}));
  });
}
async function W(op,col,id,data){
  try{
    if(!DB)throw {code:'offline'};
    const ref=DB.collection(col).doc(id);
    if(op==='delete')await ref.delete();else if(op==='update')await ref.update(data);else await ref.set(data);
    return true;
  }catch(e){
    const c=e&&e.code;
    if(c==='permission-denied'||c==='unauthenticated'){toast(t('noPerm'));return null}
    console.warn('write',col,id,c);toast(t('dlFail'));return null;
  }
}

const loginKey=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9_\-]/g,'_');

function genPassword(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const r=crypto.getRandomValues(new Uint8Array(10));
  return [...r].map(x=>a[x%a.length]).join('');
}
let fails=0,lockUntil=0;
async function doLogin(id,pw){
  if(Date.now()<lockUntil){toast(t('locked'));return false}
  try{await FSX.signIn(loginKey(id),pw);fails=0;return true}
  catch(e){
    if(e&&e.code==='network'){toast(t('offline'));return false}
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0;toast(t('locked'))}else toast(t('badLogin'));
    return false;
  }
}
async function onAuthChanged(u){
  if(settingUp)return;
  AUTH=u;authReady=true;waited=false;
  if(!u){unsubAll();resetData();meId=null;ROLE=null;R.v='home';R.p=null;R.stack=[];R.tab=null;render();return}
  try{
    const ud=await FSX.getDoc('users',u.uid);
    if(!ud||ud.active===false){toast(t('noAccount'));await FSX.signOut();return}
    meId=ud.staffId;ROLE=ud.role;
  }catch(e){meId=null}
  if(meId)subscribe();
  setTimeout(()=>{waited=true;render()},8000);
  render();
}

function myLessons(){
  if(seeAll())return vals(S.lessons);
  const gs=new Set(Object.keys(S.groups).filter(g=>S.groups[g].teacherId===meId));
  return vals(S.lessons).filter(l=>l.teacherId===meId||(!l.teacherId&&gs.has(l.groupId)));

function conflictsOf(l){
  const a=toMin(l.start),b=toMin(l.end);
  return vals(S.lessons).filter(o=>o.id!==l.id&&+o.day===+l.day&&toMin(o.start)<b&&a<toMin(o.end)&&((o.teacherId&&o.teacherId===l.teacherId)||o.groupId===l.groupId));
}
const lessonsOnDay=(day,list)=>sortBy((list||myLessons()).filter(l=>+l.day===+day),l=>l.start);

function studentAtt(sid,from,to){
  const st=S.students[sid];if(!st)return{p:0,a:0,l:0,n:0,pct:0};
  let p=0,a=0,l=0;
  Object.keys(S.sattend).forEach(k=>{
    const r=S.sattend[k];if(r.groupId!==st.groupId||r.held===false)return;
    if(from&&r.date<from)return;if(to&&r.date>to)return;
    const m=r.marks&&r.marks[sid];if(!m)return;
    if(m==='p')p++;else if(m==='a')a++;else if(m==='l')l++;
  });
  const n=p+a+l;return{p,a,l,n,pct:n?Math.round((p+l)*100/n):0};
}
function studentExams(sid){
  const out=[];
  Object.keys(S.exams).forEach(id=>{const e=S.exams[id];const r=e.results&&e.results[sid];if(r)out.push({id,title:e.title,date:e.date,score:r.score,max:r.max,pct:r.pct})});
  return sortBy(out,x=>x.date).reverse();
}
function studentExamAvg(sid){const x=studentExams(sid);return x.length?Math.round(x.reduce((s,e)=>s+e.pct,0)/x.length):null}
const zoneOf=p=>p>=90?'g':p>=70?'w':'r';
const maxOf=e=>+e.max||((e.questions||[]).reduce((s,q)=>s+(+q.pts||0),0))||100;
function zoneCounts(e){const z={g:0,w:0,r:0};Object.values(e.results||{}).forEach(r=>z[zoneOf(r.pct)]++);return z}
function examStats(e){
  const rs=Object.values(e.results||{});if(!rs.length)return{n:0,avg:0,min:0,max:0};
  const p=rs.map(r=>r.pct);return{n:rs.length,avg:Math.round(p.reduce((a,b)=>a+b,0)/p.length),min:Math.min(...p),max:Math.max(...p)};
}

function buildAlerts(){
  const out=[];const td=today();const nm=toMin(nowHM());const d=dowOf(new Date());
  const push=(key,date,level,icon,text,route,p)=>out.push({key,date,level,icon,text,route,p});
  const lessons=lessonsOnDay(d);
  if(!isA()){
    lessons.forEach(l=>{
      const st=toMin(l.start),en=toMin(l.end);const g=gname(l.groupId)+' · '+l.start;
      if(st-nm>0&&st-nm<=15)push('les-'+l.id+td,td,'high','clock',t('al_lesson',{n:st-nm,g:g}),'schedule');
      else if(nm>=st&&nm<en)push('lesn-'+l.id+td,td,'normal','clock',t('al_lessonNow',{g:g}),'schedule');
      if(nm>=en&&!sattOf(td,l.id)&&canSeeGroup(l.groupId)&&isT())push('un-'+l.id+td,td,'high','calendar',t('al_unmarked',{g:g}),'attendance',{lid:l.id,date:td});
    });
    if(isT()&&lessons.length){
      const rec=S.tattend[meId+'_'+td];
      if(!rec&&nm>=toMin(firstLessonStart(meId,td)||workStart())-30)push('ci-'+td,td,'high','clock',t('al_checkin'),'tAtt');
      const last=Math.max(...lessons.map(l=>toMin(l.end)));
      if(nm>=last&&!S.reports[meId+'_'+td])push('rep-'+td,td,'normal','report',t('al_report'),'reports');
    }
    visibleExams().filter(e=>e.date===td&&!Object.keys(e.results||{}).length).forEach(e=>push('ex-'+e.id,td,'high','exam',t('al_exam',{g:e.title+' · '+gname(e.groupId)}),'examView',{id:e.id}));
    vals(S.tasks).filter(x=>x.assignee===meId&&x.status!=='done').forEach(x=>{
      const late=x.due&&x.due<td;const soon=x.due&&x.due<=addDays(td,3);
      if(late)push('tk-'+x.id+'L',td,'high','tasks',t('al_taskLate',{g:x.title}),'tasks');
      else if(soon||!x.due)push('tk-'+x.id,x.createdDate||td,'normal','tasks',t('al_task',{g:x.title+(x.due?' · '+fmtDate(x.due):'')}),'tasks');
    });
  }
  visibleAnn().filter(a=>(a.ts||0)>Date.now()-14*864e5).forEach(a=>push('ann-'+a.id,ymd(new Date(a.ts||Date.now())),a.level==='high'?'high':'normal','announce',t('al_ann',{g:a.title}),'announcements'));
  vals(S.notices).filter(n=>n.to==='all'||n.to===meId).filter(n=>(n.ts||0)>Date.now()-14*864e5).forEach(n=>push('nt-'+n.id,ymd(new Date(n.ts||Date.now())),n.level||'normal','calendar',n.text,'schedule'));
  if(isA()||isH()){
    vals(S.exams).filter(e=>(e.created||0)>Date.now()-14*864e5).forEach(e=>push('exn-'+e.id,ymd(new Date(e.created)),'normal','exam',t('al_examNew',{g:e.title+' · '+gname(e.groupId)+' · '+fmtDate(e.date)}),'examView',{id:e.id}));
    vals(S.exams).forEach(e=>{const rs=Object.values(e.results||{});if(!rs.length)return;const last=Math.max(...rs.map(r=>r.ts||0));if(last<Date.now()-14*864e5)return;const z=zoneCounts(e),st=examStats(e);
      push('exr-'+e.id,ymd(new Date(last)),'normal','exam',t('al_examDone',{g:e.title+' · '+gname(e.groupId)+' — '+st.avg+'% (🟢'+z.g+' ⚪'+z.w+' 🔴'+z.r+')'}),'examView',{id:e.id})});
  }
  if(seeAll()){
    vals(S.messages).filter(m=>m.status==='new').forEach(m=>push('msg-'+m.id,ymd(new Date(m.ts||Date.now())),'normal','chat',t('al_msg',{g:tname(m.from)}),'messages'));
  }
  if(!seeAll()){
    vals(S.messages).filter(m=>m.from===meId&&m.reply&&m.reply.ts).forEach(m=>push('rpl-'+m.id,ymd(new Date(m.reply.ts)),'normal','chat',t('al_reply'),'messages'));
  }
  if(isA()){

  }

function openModal(title,body,foot,onMount){

  const rows=groupStudents(e.groupId).map(s=>({s,r:e.results&&e.results[s.id]}));
  const taken=rows.filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score);

  const Z=[['g',t('zoneG'),'var(--ok-soft)','var(--ok)'],['w',t('zoneW'),'var(--card)','var(--mut)'],['r',t('zoneR'),'var(--bad-soft)','var(--bad)']];
  let h=`<div class="card"><div class="b" style="font-size:19px">${esc(e.title)}</div><div class="sm mut">${esc(gname(e.groupId))} · ${esc(fmtDate(e.date))}</div>

   <div class="row wrap" style="margin-top:12px"><button class="btn grow" data-a="examResults" data-id="${R.p}">${ic('check')}${esc(t('enterResults'))}</button>${taken.length||none.length?`<button class="btn sec sm2" data-a="examImg" data-id="${R.p}">${ic('download')}${esc(t('asImage'))}</button>`:''}${taken.length?`<button class="btn sec sm2" data-a="examXls" data-id="${R.p}">${ic('download')}Excel</button>`:''}<button class="btn sec sm2" data-a="examForm" data-id="${R.p}">${ic('edit')}</button><button class="btn ghost sm2" data-a="examDel" data-id="${R.p}">${ic('trash')}</button></div></div>`;
  if(!taken.length)h+=`<div class="card sm mut">${esc(t('examHint'))}</div>`;

  return h;
};

/* ---- teacher attendance ---- */
function monthRange(ym){const [y,m]=ym.split('-').map(Number);const from=ym+'-01';const to=ymd(new Date(y,m,0));return{from,to}}
function tStats(tid,from,to){
  let days=0,lates=0,mins=0;
  Object.keys(S.tattend).forEach(k=>{const r=S.tattend[k];if(r.teacherId!==tid||r.date<from||r.date>to)return;days++;if(r.late)lates++;mins+=hoursBetween(r.in,r.out)});
  return{days,lates,mins};
}
V.tAtt=function(){

    else if(!rec.out)h+=`<div class="card"><div class="b">${esc(t('inAt',{t:rec.in}))}</div><div class="sm ${rec.late?'':'mut'}" style="${rec.late?'color:var(--bad)':''}">${esc(rec.late?t('lateMin',{n:rec.lateMin||0}):t('onTime'))}</div><button class="btn bad full" data-a="checkOut" style="margin-top:12px;min-height:64px;font-size:18px">${esc(t('checkOut'))}</button></div>`;
    else h+=`<div class="banner ok">${esc(t('dayDone'))}: ${esc(rec.in)}–${esc(rec.out)} (${fmtHM(hoursBetween(rec.in,rec.out))} ${esc(t('hours'))})</div>`;
    const s=tStats(meId,from,to);
    h+=mseg+`<div class="row" style="margin-bottom:12px"><div class="stat"><b>${s.days}</b><span>${esc(t('daysPresent'))}</span></div><div class="stat"><b>${fmtHM(s.mins)}</b><span>${esc(t('totalHours'))}</span></div><div class="stat"><b>${s.lates}</b><span>${esc(t('lateCount'))}</span></div></div>`;
    const recs=sortBy(vals(S.tattend).filter(r=>r.teacherId===meId&&r.date>=from&&r.date<=to),r=>r.date).reverse();

    h+=`<div class="xs mut tc">${esc(t('adminEditOnly'))}</div>`;
    return h;
  }
  const date=R.filter.td||td;
  const tchs=sortBy(vals(S.staff).filter(s=>s.role==='teacher'&&s.active!==false),s=>s.name);
  h+=`<label class="f"><span>${esc(t('date'))}</span><input type="date" data-c="td" value="${date}"></label>`;
  h+=`<div class="card">${tchs.map(s=>{const r=S.tattend[s.id+'_'+date];return `<div class="li"><div class="av">${esc(initials(s.name))}</div><div class="grow"><div class="b">${esc(s.name)}</div><div class="sm mut">${r?esc(r.in+' – '+(r.out||'…')):esc(t('notCame'))}</div></div>${r?(r.late?chip(t('lateMin',{n:r.lateMin||0}),'bad'):chip(t('onTime'),'ok')):chip('—','gray')}${isA()?`<button class="btn ghost sm2" data-a="tAttEdit" data-tid="${s.id}" data-date="${date}">${ic('edit')}</button>`:''}</div>`}).join('')||empty()}</div>`;
  h+=`<div class="h3">${esc(t('month'))}</div>`+mseg;
  h+=`<div class="tblw"><table><tr><th>${esc(t('teacher'))}</th><th>${esc(t('daysPresent'))}</th><th>${esc(t('totalHours'))}</th><th>${esc(t('lateCount'))}</th></tr>${tchs.map(s=>{const x=tStats(s.id,from,to);return `<tr><td>${esc(s.name)}</td><td>${x.days}</td><td>${fmtHM(x.mins)}</td><td>${x.lates}</td></tr>`}).join('')}</table></div>`;
  return h;
};

/* ---- reports ---- */
const RTYPES=['rp_teacherDaily','rp_teacherAtt','rp_groups','rp_studentAtt','rp_exams','rp_progress','rp_lessons'];
function datesIn(from,to){const o=[];let d=from,n=0;while(d<=to&&n<93){o.push(d);d=addDays(d,1);n++}return o}
function lessonStatus(l,date){
  const rec=sattOf(date,l.id);const td=today();
  if(rec)return rec.held===false?{s:'missed',reason:rec.reason||''}:{s:'held',reason:''};
  if(date<td)return{s:'unmarked',reason:''};
  return{s:'pending',reason:''};
}
function buildReport(){
  const f=R.filter;const type=f.rt||RTYPES[0];
  const td=today();const from=f.rf||td.slice(0,8)+'01';const to=f.rto||td;
  const gsel=f.rg||'';const tsel=isT()?meId:(f.rtc||'');
  const gids=myGroupIds().filter(g=>!gsel||g===gsel);
  const title=t(type);let head=[],rows=[];
  const dates=datesIn(from,to);
  const tchIds=(isT()?[meId]:vals(S.staff).filter(s=>s.role==='teacher'&&(!tsel||s.id===tsel)).map(s=>s.id));
  const lessonsOf=tid=>vals(S.lessons).filter(l=>l.teacherId===tid||(!l.teacherId&&S.groups[l.groupId]&&S.groups[l.groupId].teacherId===tid));
  if(type==='rp_teacherDaily'){
    head=[t('date'),t('teacher'),t('planned'),t('heldN'),t('missedN'),t('notMarked'),t('arrived'),t('left'),t('hasReport')];
    dates.forEach(d=>tchIds.forEach(tid=>{
      const ls=lessonsOf(tid).filter(l=>+l.day===dowOf(parseYmd(d)));const rec=S.tattend[tid+'_'+d];const rp=S.reports[tid+'_'+d];
      if(!ls.length&&!rec&&!rp)return;
      const st=ls.map(l=>lessonStatus(l,d).s);
      rows.push([fmtDate(d),tname(tid),ls.length,st.filter(x=>x==='held').length,st.filter(x=>x==='missed').length,st.filter(x=>x==='unmarked').length,rec?rec.in:'—',rec&&rec.out?rec.out:'—',rp?(rp.text||'✓'):'—']);
    }));
  }else if(type==='rp_teacherAtt'){
    head=[t('teacher'),t('daysPresent'),t('totalHours'),t('lateCount')];
    tchIds.forEach(tid=>{const x=tStats(tid,from,to);rows.push([tname(tid),x.days,fmtHM(x.mins),x.lates])});
  }else if(type==='rp_groups'){
    head=[t('group'),t('teacher'),t('students'),t('lessonsWeek'),t('attPct'),t('avgExam')];
    gids.forEach(g=>{
      const sts=groupStudents(g);let p=0,n=0;sts.forEach(s=>{const a=studentAtt(s.id,from,to);p+=a.p+a.l;n+=a.n});
      const ex=vals(S.exams).filter(e=>e.groupId===g&&e.date>=from&&e.date<=to&&Object.keys(e.results||{}).length);
      const ea=ex.length?Math.round(ex.reduce((s,e)=>s+examStats(e).avg,0)/ex.length):null;
      rows.push([gname(g),S.groups[g].teacherId?tname(S.groups[g].teacherId):'—',sts.length,vals(S.lessons).filter(l=>l.groupId===g).length,n?pct(p,n)+'%':'—',ea==null?'—':ea+'%']);
    });
  }else if(type==='rp_studentAtt'){
    head=[t('student'),t('group'),t('present2'),t('absent2'),t('late2'),t('attPct')];
    myStudents().filter(s=>!gsel||s.groupId===gsel).forEach(s=>{const a=studentAtt(s.id,from,to);rows.push([s.name,gname(s.groupId),a.p,a.a,a.l,a.n?a.pct+'%':'—'])});
  }else if(type==='rp_exams'){
    head=[t('date'),t('group'),t('examTitle'),t('participants'),t('avg'),t('min'),t('max'),'≥90','70–89','<70'];
    sortBy(visibleExams().filter(e=>(!gsel||e.groupId===gsel)&&e.date>=from&&e.date<=to),e=>e.date).forEach(e=>{const s=examStats(e);const z=zoneCounts(e);rows.push([fmtDate(e.date),gname(e.groupId),e.title,s.n+'/'+groupStudents(e.groupId).length,s.n?s.avg+'%':'—',s.n?s.min+'%':'—',s.n?s.max+'%':'—',z.g,z.w,z.r])});
  }else if(type==='rp_progress'){
    head=[t('student'),t('group'),t('progress'),t('grade'),t('avgExam'),t('attPct')];
    myStudents().filter(s=>!gsel||s.groupId===gsel).forEach(s=>{const ea=studentExamAvg(s.id),a=studentAtt(s.id,from,to);rows.push([s.name,gname(s.groupId),(+s.progress||0)+'%',s.grade||'—',ea==null?'—':ea+'%',a.n?a.pct+'%':'—'])});
  }else{
    head=[t('date'),t('lessons'),t('group'),t('teacher'),t('status'),t('reason')];
    const ls=myLessons().filter(l=>!gsel||l.groupId===gsel).filter(l=>!tsel||l.teacherId===tsel);
    dates.forEach(d=>sortBy(ls.filter(l=>+l.day===dowOf(parseYmd(d))),l=>l.start).forEach(l=>{
      const x=lessonStatus(l,d);if(x.s==='pending'&&d>td)return;
      rows.push([fmtDate(d),l.start+'–'+l.end,gname(l.groupId),l.teacherId?tname(l.teacherId):'—',x.s==='held'?t('heldN'):x.s==='missed'?t('missedN'):x.s==='unmarked'?t('notMarked'):'…',x.reason]);
    }));
  }
  return{title,head,rows,from,to};
}

    <div class="row" style="margin-top:12px"><button class="btn sec grow" data-a="rXls">${ic('download')}${esc(t('exportExcel'))}</button>${FSX.native?'':`<button class="btn sec grow" data-a="rPdf">${ic('print')}${esc(t('exportPdf'))}</button>`}</div>`;

  return h;

/* ---- teacher monthly profile (admin & head only) ---- */
const teacherLessons=tid=>vals(S.lessons).filter(l=>l.teacherId===tid||(!l.teacherId&&S.groups[l.groupId]&&S.groups[l.groupId].teacherId===tid));
function profData(tid,ym,inc){
  const {from,to}=monthRange(ym);const td=today();
  const ls=teacherLessons(tid);const days=[];let held=0,missed=0,unm=0,mins=0;const byG={};
  datesIn(from,to).forEach(d=>{
    if(d>td)return;
    const items=sortBy(ls.filter(l=>+l.day===dowOf(parseYmd(d))),l=>l.start).map(l=>{const st=lessonStatus(l,d);return{l,st:st.s,reason:st.reason,dur:toMin(l.end)-toMin(l.start)}});
    const rec=S.tattend[tid+'_'+d];
    if(!items.length&&!rec)return;
    let dm=0;
    items.forEach(it=>{
      const count=it.st==='held'||(inc&&it.st==='unmarked');it.count=count;
      if(count){dm+=it.dur;held++;const g=byG[it.l.groupId]=byG[it.l.groupId]||{n:0,mins:0};g.n++;g.mins+=it.dur}
      if(it.st==='missed')missed++;if(it.st==='unmarked')unm++;
    });
    mins+=dm;days.push({date:d,items,dm,rec});
  });
  const site=tStats(tid,from,to);
  const gset=new Set(ls.map(l=>l.groupId));Object.keys(S.groups).forEach(g=>{if(S.groups[g].teacherId===tid)gset.add(g)});
  const exInMonth=vals(S.exams).filter(e=>e.date>=from&&e.date<=to);
  const groups=[...gset].filter(g=>S.groups[g]).map(g=>{
    const exs=exInMonth.filter(e=>e.groupId===g);const done=exs.filter(e=>examStats(e).n>0);
    const avg=done.length?Math.round(done.reduce((s,e)=>s+examStats(e).avg,0)/done.length):null;
    const studs=groupStudents(g).map(s=>{const ps=exs.map(e=>e.results&&e.results[s.id]).filter(Boolean).map(r=>r.pct);return{s,n:ps.length,avg:ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):null}});
    return{id:g,name:gname(g),lessons:(byG[g]||{n:0}).n,mins:(byG[g]||{mins:0}).mins,exams:exs.length,examsDone:done.length,avg,studs:sortBy(studs.slice(),x=>x.avg==null?-1:x.avg).reverse()};
  });
  const myEx=exInMonth.filter(e=>gset.has(e.groupId)&&(e.by===tid||!S.staff[e.by]||S.staff[e.by].role!=='teacher'));
  return{from,to,days,held,missed,unm,mins,site,groups,examCount:myEx.length};
}

    ${d.rec?`<div class="xs mut" style="margin-top:8px">${esc(t('onSite'))}: ${esc(d.rec.in)}–${esc(d.rec.out||'…')}${d.rec.out?' ('+fmtHM(hoursBetween(d.rec.in,d.rec.out))+')':''}${d.rec.late?' · '+esc(t('lateMin',{n:d.rec.lateMin||0})):''}</div>`:''}</div>`).join(''):empty();
  h+=`</div><div class="row" style="margin-top:12px"><button class="btn sec grow" data-a="tprofXls">${ic('download')}${esc(t('exportExcel'))}</button>${FSX.native?'':`<button class="btn sec grow" data-a="rPdf">${ic('print')}${esc(t('exportPdf'))}</button>`}</div>`;

function textFocused(){
  const a=document.activeElement;if(!a||!$('#app').contains(a))return false;
  if(a.tagName==='TEXTAREA')return true;
  if(a.tagName==='INPUT')return ['text','search','password','tel','number','url','email'].includes(a.type);
  return false;
}
function render(){clearTimeout(rT);rT=setTimeout(doRender,30)}
function doRender(){
  applyTheme();

  if(!window.FSX||!FSX.configured)html=box(`<div class="banner bad">${esc(t('cfgErr'))}</div>`);
  else if(!authReady)html=box(`<p>${esc(t('loading'))}</p>`);
  else if(!AUTH)html=loginScreen();
  else if(!meId||!S.staff[meId]){
    html=waited?box(`<div class="banner bad">${esc(t('noAccount'))}</div><button class="btn full" data-a="reload">${esc(t('retry'))}</button><div class="gap"></div><button class="btn ghost full" data-a="logout">${esc(t('logout'))}</button>`):box(`<p>${esc(t('loading'))}</p>`);

  else html=shell();
  app.innerHTML=html;
}

FORM.login=async fd=>{await doLogin(fd.get('login'),String(fd.get('pw')||''))};
FORM.first=async fd=>{
  const login=String(fd.get('login')).trim();const pw=String(fd.get('pw'));const name=String(fd.get('name')).trim();
  const key=loginKey(login);
  if(pw.length<8){toast(t('passShort'));return}
  if(!key||!name){toast(t('required'));return}
  settingUp=true;
  try{
    let u;
    try{u=await FSX.signUp(emailFor(key,0),pw)}
    catch(e){if(e&&e.code==='auth/email-already-in-use')u=await FSX.signInEmail(emailFor(key,0),pw);else throw e}
    const sid=uid();
    await FSX.db.collection('users').doc(u.uid).set({staffId:sid,role:'admin',active:true,login,name});
    await FSX.db.collection('staff').doc(sid).set({name,login,role:'admin',active:true,mustChange:false,uid:u.uid,v:0,created:Date.now()});
    await FSX.db.collection('logins').doc(key).set({email:emailFor(key,0),staffId:sid});
    await FSX.db.collection('config').doc('init').set({done:true,ts:Date.now()});
    needSetup=false;settingUp=false;
    await onAuthChanged(u);
  }catch(e){
    settingUp=false;console.warn(e);
    toast(e&&e.code==='auth/weak-password'?t('passShort'):t('setupFail'));
    try{await FSX.signOut()}catch(_){}
  }
};
FORM.pw=async fd=>{
  const cur=String(fd.get('cur')),n1=String(fd.get('n1')),n2=String(fd.get('n2'));
  if(n1.length<8){toast(t('passShort'));return}
  if(n1!==n2){toast(t('passMismatch'));return}
  try{await FSX.changePassword(cur,n1)}
  catch(e){const c=e&&e.code;toast(c==='auth/wrong-password'||c==='auth/invalid-credential'?t('wrongCur'):t('dlFail'));return}
  const r=await W('update','staff',meId,{mustChange:false});
  if(r!==null){toast(t('passChanged'));if(R.stack.length)goBack();else render()}
};

async function newAuthAccount(key,startV,pw){
  for(let v=startV;v<startV+8;v++){
    const email=emailFor(key,v);
    try{const u=await FSX.createAccount(email,pw);return{uid:u,email,v}}
    catch(e){if(e&&e.code==='auth/email-already-in-use')continue;throw e}
  }
  throw {code:'too-many'};
}
const authErr=e=>{const c=e&&e.code;return c==='auth/network-request-failed'?t('offline'):c==='auth/weak-password'?t('passShort'):t('dlFail')};
FORM.staff=async fd=>{
  const isNew=!fd.get('id');const sid=fd.get('id')||uid();
  const login=String(fd.get('login')).trim();const name=String(fd.get('name')).trim();
  if(!login||!name){toast(t('required'));return}
  const key=loginKey(login);
  if(vals(S.staff).some(s=>s.id!==sid&&loginKey(s.login)===key)){toast(t('loginTaken'));return}
  const role=fd.get('role');const active=fd.get('active')==='on';
  const old=clone(S.staff[sid]||{});
  if(old.role==='admin'&&(role!=='admin'||!active)&&activeAdmins(sid)===0){toast(t('lastAdmin'));return}
  const pw=String(fd.get('pw')||'');const phone=String(fd.get('phone')||'').trim();
  let shown=null;
  if(isNew){
    if(pw.length<8){toast(t('passShort'));return}
    let acc;try{acc=await newAuthAccount(key,0,pw)}catch(e){toast(authErr(e));return}
    if(null===await W('set','users',acc.uid,{staffId:sid,role,active,login,name}))return;
    if(null===await W('set','staff',sid,{name,login,role,active,phone,mustChange:true,uid:acc.uid,v:acc.v,created:Date.now()}))return;
    if(null===await W('set','logins',key,{email:acc.email,staffId:sid}))return;
    shown=pw;
  }else{
    let uidNew=old.uid,vNew=old.v||0;
    if(pw){
      if(pw.length<8){toast(t('passShort'));return}
      let acc;try{acc=await newAuthAccount(key,vNew+1,pw)}catch(e){toast(authErr(e));return}
      if(null===await W('set','users',acc.uid,{staffId:sid,role,active,login:old.login||login,name}))return;
      if(old.uid)await W('delete','users',old.uid);
      await W('set','logins',key,{email:acc.email,staffId:sid});
      uidNew=acc.uid;vNew=acc.v;shown=pw;
    }else if(old.uid){
      await W('update','users',old.uid,{role,active,name});
    }
    const upd={name,role,active,phone,uid:uidNew,v:vNew};if(pw)upd.mustChange=true;
    if(null===await W('update','staff',sid,upd))return;
  }
  if(resetReqId){await W('update','resets',resetReqId,{done:true});resetReqId=null}
  closeModal();
  if(shown)openModal(t('passCopy'),`<div class="card"><div class="sm mut">${esc(t('loginId'))}</div><div class="b" style="font-size:20px">${esc(login)}</div><div class="sm mut" style="margin-top:10px">${esc(t('tempPass'))}</div><div class="b" style="font-size:22px;letter-spacing:1px;user-select:all">${esc(shown)}</div></div><div class="banner warn">${esc(t('passNote'))}</div>`,`<button class="btn" data-a="closeModal">${esc(t('ok'))}</button>`);
  else toast(t('saved'));
};

function resizeImg(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'));
    };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ---- exam result as picture (green >=90, white 70-89, red <70) ---- */
let lastImg=null;
const fmtNum=n=>String(Math.round(n*100)/100);
function examCanvas(e){
  const mx=maxOf(e);
  const rows=groupStudents(e.groupId).map(s=>({s,r:e.results&&e.results[s.id]}));
  const taken=rows.filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score||String(a.s.name).localeCompare(b.s.name));
  const none=rows.filter(x=>!x.r);
  const list=taken.map((x,i)=>({n:i+1,name:x.s.name,val:fmtNum(x.r.score),c:zoneOf(x.r.pct)})).concat(none.map((x,i)=>({n:taken.length+i+1,name:x.s.name,val:'НБ',c:'r'})));
  const W=420,rh=32,sc=3,cols=[44,260,116],cap=26;
  const H=rh*(2+list.length)+cap;
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;
  const x=cv.getContext('2d');x.scale(sc,sc);
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const FONT='"Times New Roman",Times,"Noto Serif",serif';
  const fit=(txt,maxW,size)=>{let s=size;x.font='bold '+s+'px '+FONT;while(x.measureText(txt).width>maxW&&s>9){s--;x.font='bold '+s+'px '+FONT}};
  const cell=(cx,cy,w,h,bg,txt,align)=>{
    x.fillStyle=bg;x.fillRect(cx,cy,w,h);x.strokeStyle='#000';x.lineWidth=1;x.strokeRect(cx+.5,cy+.5,w-1,h-1);
    x.fillStyle='#000';x.textBaseline='middle';fit(txt,w-14,16);
    x.textAlign=align;x.fillText(txt,align==='center'?cx+w/2:cx+8,cy+h/2+1);
  };
  const tt=String(e.title||'').toUpperCase();const title=(/ИМТИҲОН|ИМТИХОН|ЭКЗАМЕН/.test(tt)?'НАТИҶАИ ':'НАТИҶАИ ИМТИҲОНИ РӮЗОНА ')+tt+(mx!==100?' ('+mx+' БАЛЛ)':'');
  x.fillStyle='#FFFF00';x.fillRect(0,0,W,rh);x.strokeStyle='#000';x.strokeRect(.5,.5,W-1,rh-1);
  x.fillStyle='#000';x.textBaseline='middle';x.textAlign='center';fit(title,W-14,16);x.fillText(title,W/2,rh/2+1);
  let cx=0;['№','НОМУ НАСАБ','БАЛЛ'].forEach((h,i)=>{cell(cx,rh,cols[i],rh,'#FFFF00',h,'center');cx+=cols[i]});
  const BG={g:'#00B050',w:'#FFFFFF',r:'#FF0000'};
  list.forEach((it,i)=>{
    const y=rh*(2+i);cx=0;
    cell(cx,y,cols[0],rh,BG[it.c],String(it.n),'center');cx+=cols[0];
    cell(cx,y,cols[1],rh,BG[it.c],it.name,'left');cx+=cols[1];
    cell(cx,y,cols[2],rh,BG[it.c],it.val,'center');
  });
  x.fillStyle='#555';x.font='12px system-ui,sans-serif';x.textAlign='left';x.textBaseline='middle';
  x.fillText(gname(e.groupId)+' · '+fmtDate(e.date),6,H-cap/2);
  return cv;
}

};
ACT.tprofXls=async()=>{
  const f=R.filter;const tch=teacherOpts();const tid=f.pt&&S.staff[f.pt]?f.pt:tch[0][0];const ym=f.pm||today().slice(0,7);const P=profData(tid,ym,!!f.pu);
  const lab=x=>x.st==='held'?t('heldN'):x.st==='missed'?t('missedN'):x.st==='unmarked'?t('unmarkedN'):'…';
  const aoa=[[t('tProf')+': '+tname(tid)+' · '+ym],[],
   [t('daysTaught'),P.days.filter(d=>d.dm>0).length],[t('lessonsHeld'),P.held],[t('teachHours'),fmtHM(P.mins)],[t('siteHours'),fmtHM(P.site.mins)],[t('examsHeld'),P.examCount],[t('lateCount'),P.site.lates],[],
   [t('groups')],[t('group'),t('lessonsHeld'),t('teachHours'),t('examsMonth'),t('groupMonthScore')]];
  P.groups.forEach(g=>aoa.push([g.name,g.lessons,fmtHM(g.mins),g.exams,g.avg==null?'—':g.avg+'%']));
  aoa.push([],[t('dayList')],[t('date'),'',t('start'),t('end'),t('group'),t('status'),t('teachHours'),t('arrived'),t('left')]);
  P.days.forEach(d=>{
    if(!d.items.length)aoa.push([fmtDate(d.date),dayName(dowOf(parseYmd(d.date))),'','','','','',d.rec?d.rec.in:'',d.rec&&d.rec.out?d.rec.out:'']);
    d.items.forEach((it,i)=>aoa.push([fmtDate(d.date),dayName(dowOf(parseYmd(d.date))),it.l.start,it.l.end,gname(it.l.groupId),lab(it),it.count?fmtHM(it.dur):'',i===0&&d.rec?d.rec.in:'',i===0&&d.rec&&d.rec.out?d.rec.out:'']));
    aoa.push(['','','','','',t('total2'),fmtHM(d.dm)]);
  });
  aoa.push([],[t('studentMonthAvg')],[t('group'),t('student'),t('examsMonth'),t('avg')]);
  P.groups.forEach(g=>g.studs.forEach(x=>aoa.push([g.name,x.s.name,x.n,x.avg==null?'—':x.avg+'%'])));
  const nm='teacher-'+ym;
  if(window.XLSX){
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:14},{wch:14},{wch:10},{wch:10},{wch:22},{wch:14},{wch:12},{wch:10},{wch:10}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Teacher');
    await saveFile(nm+'.xlsx',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})));
  }else{
    const q=c=>'"'+String(c).replace(/"/g,'""')+'"';
    await saveFile(nm+'.csv','\ufeff'+aoa.map(r=>r.map(q).join(',')).join('\n'));
  }
};
ACT.rPdf=()=>{toast(t('pdfHint'));setTimeout(()=>{try{window.print()}catch(e){}},900)};
ACT.doBackup=async()=>{
  const data={app:'future-school-teacher',version:VER,created:new Date().toISOString()};COLS.forEach(c=>data[c]=S[c]);
  await saveFile('future-school-backup-'+today()+'.json',JSON.stringify(data));
};
ACT.doRestore=()=>{const f=$('#restoreFile');if(f)f.click()};
document.addEventListener('change',async e=>{
  if(e.target.id!=='restoreFile')return;
  const file=e.target.files[0];if(!file)return;
  let data;try{data=JSON.parse(await file.text());if(data.app!=='future-school-teacher')throw 0}catch(err){toast(t('restoreBad'));return}
  if(!await confirmBox(t('restoreWarn')))return;
  let n=0;
  for(const c of COLS){const col=data[c];if(!col||typeof col!=='object')continue;
    for(const id of Object.keys(col)){const r=await W('set',c,id,col[id]);if(r===null){toast(t('noPerm'));return}n++}}
  toast(t('restoreOk',{n}));
});

/* ---- local notifications (native app only) ---- */
function hash32(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)%2147483000+1}
async function planNotifs(){
  if(!window.FSX||!FSX.native||!FSX.scheduleNotifs)return;
  if(!meId||!isT()){await FSX.scheduleNotifs([]);return}
  const items=[];const now=Date.now();
  for(let k=0;k<7;k++){
    const d=addDays(today(),k);const dw=dowOf(parseYmd(d));
    teacherLessons(meId).filter(l=>+l.day===dw).forEach(l=>{
      const hm=String(l.start).split(':').map(Number);const dt=parseYmd(d);dt.setHours(hm[0],hm[1]-15,0,0);
      if(dt.getTime()>now)items.push({id:hash32(l.id+d),title:t('app'),body:t('al_lesson',{n:15,g:gname(l.groupId)+' · '+l.start}),at:dt});
    });
  }
  items.sort((a,b)=>a.at-b.at);
  await FSX.scheduleNotifs(items.slice(0,60));
}
/* ================= boot ================= */
(async function boot(){
  applyTheme();render();
  if(window.FSX&&FSX.configured){
    window.XLSX=FSX.XLSX;DB=FSX.db;
    if(FSX.onBack)FSX.onBack(()=>{
      if(modalOpen()){closeModal();return}
      if(R.stack.length){goBack();return}
      if(R.v!=='home'){goRoot('home');return}
      if(FSX.exitApp)FSX.exitApp();
    });
    try{const init=await FSX.getDoc('config','init');needSetup=!init}catch(e){needSetup=false}
    FSX.onAuth(onAuthChanged);
  }else{authReady=true}
  setInterval(tick,30000);
  render();
})();
